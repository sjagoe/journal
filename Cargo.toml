[package]
name = "journal"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "journal"

[dependencies]
age = { version = "^0.10", default-features = false, features = ["cli-common", "ssh", "armor", "plugin"] }
clap = { version = "4.5.45", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
digest-io = "0.1.0"
dirs = "6.0.0"
git2 = "0.21.0"
ratatui = "0.30.0"
ratin = "0.2.1"
regex = "1.13.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.11.1"
shell-words = "1.1.1"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }

[profile.dev]
# Turn on a small amount of optimisation in Development mode.
opt-level = 1

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 3
