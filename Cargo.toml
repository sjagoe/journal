[package]
name = "journal"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "journal"

[dependencies]
age = { version = "0.12.1", features = ["cli-common", "ssh", "armor", "plugin"] }
clap = { version = "4.5.45", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
dirs = "6.0.0"
git2 = "0.21.0"
ratatui = "0.29.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
shell-words = "1.1.1"
time = { version = "0.3.55", features = ["formatting", "macros"] }

[profile.dev]
# Turn on a small amount of optimisation in Development mode.
opt-level = 1

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 3
