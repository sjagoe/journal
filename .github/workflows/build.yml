name: Build journal

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nixos-release:
          - nixos-26.05
          - nixos-unstable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:${{ matrix.nixos-release }}

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_REPOSITORY }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: flake check
        run: |
          nix flake check --print-build-logs

      - name: Build
        env:
          CACHIX_PUBLIC_KEY: ${{ vars.CACHIX_PUBLIC_KEY }}
          CACHIX_REPOSITORY: ${{ vars.CACHIX_REPOSITORY }}
        run: |
          OPTIONS=(
            --no-link
            --print-out-paths
            --print-build-logs
            --option extra-substituters "https://${CACHIX_REPOSITORY}.cachix.org"
            --option extra-trusted-public-keys "${CACHIX_PUBLIC_KEY}"
          )
          nix build .#journal "${OPTIONS[@]}"

  build-completed:
    name: Build completed
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - name: Finalize overall build status status
        env:
          STATE: ${{ needs.build.result }}
        run: |
          [[ "$STATE" == "success" ]]
